name: Release

# Tag-driven release pipeline. Nothing else in the repository is touched.
#   git tag v0.1.0 && git push origin v0.1.0
# Produces: sdist + wheel + SHA256SUMS  ->  draft GitHub Release assets
#           OCI image                   ->  GitHub Packages (ghcr.io)
# The Release stays a draft until a maintainer reviews it and clicks Publish;
# that publishes the release and hands off to publish-pypi.yml.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/sunshinemahiru/deepseek-ucs-adapter

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != version:
              raise SystemExit(f"tag {tag!r} does not match pyproject version {version!r}")
          print(f"version verified: {version}")
          PY

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.whl ./*.tar.gz | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  container:
    name: Publish image to GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create draft GitHub Release
    needs: [build, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Gate: the release is created as a DRAFT. Nothing is visible on the
      # Releases page until a maintainer reviews the notes and clicks Publish.
      # Publishing the draft fires `release: published`, which triggers
      # publish-pypi.yml -> PyPI upload.
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="deepseek-ucs-adapter ${tag}"
          notes=".github/release-notes/${tag}.md"
          assets=(dist/*.whl dist/*.tar.gz dist/SHA256SUMS)

          if gh release view "${tag}" >/dev/null 2>&1; then
            # Re-run of an existing release: refresh notes and assets only.
            # The draft/published state is deliberately left untouched so a
            # retry can never un-publish a release that is already live.
            echo "::notice::release ${tag} already exists; refreshing assets, draft state preserved"
            edit=(--title "${title}")
            if [[ -f "${notes}" ]]; then
              edit+=(--notes-file "${notes}")
            fi
            gh release edit "${tag}" "${edit[@]}"
            gh release upload "${tag}" --clobber "${assets[@]}"
          else
            create=(--draft --verify-tag --title "${title}")
            if [[ -f "${notes}" ]]; then
              create+=(--notes-file "${notes}")
            else
              create+=(--generate-notes)
            fi
            gh release create "${tag}" "${create[@]}" "${assets[@]}"
            echo "::notice::draft ${tag} created - review it, then click Publish to trigger the PyPI upload"
          fi
